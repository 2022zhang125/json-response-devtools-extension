<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="app">
      <div class="toolbar">
        <div class="response-search-toolbar">
          <input
            id="searchInput"
            class="search-input"
            placeholder="Search response"
          />
          <span id="searchCount" class="search-count"></span>
          <button id="searchCaseSensitiveBtn" class="search-toggle-button" title="区分大小写 (Alt+C)">Aa</button>
          <button id="searchWholeWordBtn" class="search-toggle-button" title="全词匹配 (Alt+W)">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
              <path d="M0 11H1V13H15V11H16V14H0V11Z"/>
              <path d="M6.5 3H7.9L11 11H9.7L9 9H5L4.3 11H3L6.5 3ZM7 4.9L5.4 8.2H8.6L7 4.9Z"/>
            </svg>
          </button>
          <button id="searchRegexBtn" class="search-toggle-button" title="使用正则表达式 (Alt+R)">.*</button>
          <button id="prevBtn" class="toolbar-button">↑</button>
          <button id="nextBtn" class="toolbar-button">↓</button>
        </div>
      </div>

      <div id="layout" class="layout">
        <aside id="requestPanel" class="request-panel">
          <div class="request-panel-header">
            <span class="request-panel-title">Requests</span>

            <div class="request-panel-actions">
              <button
                id="clearRequestsBtn"
                class="clear-requests-button"
                title="Clear requests"
              >
                清空
              </button>

              <button
                id="collapseSidebarBtn"
                class="sidebar-toggle-button"
                title="Collapse sidebar"
              >
                ‹
              </button>
            </div>
          </div>

          <div id="requestList" class="request-list"></div>
        </aside>

        <div
          id="resizeHandle"
          class="resize-handle"
          title="Drag to resize"
        ></div>

        <main class="viewer-panel">
          <button
            id="expandSidebarBtn"
            class="expand-sidebar-button hidden"
            title="Expand sidebar"
          >
            ›
          </button>

          <div class="viewer-tabs">
            <button id="tabResponse" class="viewer-tab is-active">Response</button>
            <button id="tabRequest" class="viewer-tab">Request</button>
          </div>

          <div id="jsonViewer" class="json-viewer">
            <div class="empty">请先从左侧选择一个 JSON 请求</div>
          </div>

          <div id="requestViewer" class="request-viewer hidden"></div>
        </main>
      </div>

      <div id="toast" class="toast hidden"></div>
    </div>

    <script src="lib/crypto-js.js"></script>
    <script src="lib/sm4.js"></script>
    <script src="config.js"></script>
    <script src="decrypt.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
